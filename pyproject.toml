[project]
name = "invariant-vigil"
version = "0.2.0"
description = "Runtime policy foundation and AI FinOps helpers for LLM agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Invariant Labs" }]
keywords = ["llm", "agents", "policy", "finops", "governance", "vigil"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4.23.0",
  "pyyaml>=6.0.2",
  "typer>=0.16.0",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.8.0",
  "hypothesis>=6.131.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.1.0",
  "radon>=6.0.1",
  "ruff>=0.11.0",
  "ty>=0.0.1a16",
]

[project.scripts]
vigil = "vigil.cli:app"

[project.urls]
Homepage = "https://github.com/invariant-sh/vigil"
Documentation = "https://github.com/invariant-sh/vigil#readme"
Repository = "https://github.com/invariant-sh/vigil"
Issues = "https://github.com/invariant-sh/vigil/issues"
Changelog = "https://github.com/invariant-sh/vigil/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigil"]

[tool.hatch.build.targets.wheel.sources]
"src/vigil" = "vigil"

[tool.hatch.build.targets.sdist]
include = [
  "/src/vigil",
  "/contracts",
  "/examples",
  "/scripts",
  "/README.md",
  "/LICENSE",
  "/SECURITY.md",
  "/CHANGELOG.md",
]

# `uv sync` installs this group by default. The optional `dev` extra above
# stays so `uv sync --extra dev` still resolves the same tools.
[dependency-groups]
dev = [
  "coverage[toml]>=7.8.0",
  "hypothesis>=6.131.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.1.0",
  "radon>=6.0.1",
  "ruff>=0.11.0",
  "ty>=0.0.1a16",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "examples"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
  "N",
  "ANN",
  "S",
  "T20",
  "C4",
  "PT",
]
ignore = [
  "ANN401",
  "S101",
  "S603",
  "S607",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S105", "S106", "T20"]
"examples/**/*.py" = ["ANN", "T20", "S105", "S106", "S310"]
"scripts/**/*.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]

[tool.coverage.run]
branch = true
source = ["vigil"]
omit = [
  "*/cli.py",
  "*/__main__.py",
]

[tool.coverage.report]
fail_under = 78
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests", "scripts"]
exclude = ["examples"]

[tool.ty.rules]
all = "error"
