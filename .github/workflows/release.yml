# Publish invariant-vigil on v* tags.
#
# Trusted Publishing (no API token in this repo). Before the first tag, register
# a pending publisher at https://pypi.org/manage/account/publishing/ :
#   PyPI project name: invariant-vigil
#   Owner:             invariant-sh
#   Repository name:   vigil
#   Workflow name:     release.yml
#   Environment name:  pypi
# And create a GitHub environment named pypi (no secrets).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.13.5"
          enable-cache: true
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Require the tag to match the built version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/invariant_vigil-${version}.tar.gz"
          test -f "dist/invariant_vigil-${version}-py3-none-any.whl"

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/invariant-vigil/
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          attestations: true

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: dist/*
          body: |
            Install with `pip install invariant-vigil` or `uv tool install invariant-vigil`.

            The import package and the `vigil` command are unchanged. `vigil` on PyPI is an unrelated project.
